<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HRIS API Reference</title>
    <link rel="icon" href="/img/favicon.svg" />
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      .bar {
        display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;
        padding: 0.6rem 1rem; border-bottom: 1px solid #e2e8f0; background: #f8fafc;
      }
      .bar a { color: #1a78d7; text-decoration: none; font-weight: 600; }
      .bar label { color: #475569; font-size: 0.9rem; }
      .bar select { padding: 0.25rem 0.4rem; font-size: 0.9rem; }
      .error { padding: 2rem 1rem; color: #b91c1c; }
    </style>
  </head>
  <body>
    <div class="bar">
      <a href="/docs/api/overview">← HRIS Docs</a>
      <label for="version">Backend version</label>
      <select id="version"></select>
    </div>
    <div id="redoc"></div>

    <script src="https://cdn.jsdelivr.net/npm/redoc@2.5.1/bundles/redoc.standalone.js"></script>
    <script>
      // The version comes from ?v= and must be listed in /openapi/versions.json
      (async function () {
        const select = document.getElementById("version");
        const target = document.getElementById("redoc");

        let versions = [];
        try {
          versions = await (await fetch("/openapi/versions.json")).json();
        } catch {
          target.innerHTML = '<p class="error">The version list could not be loaded.</p>';
          return;
        }

        const requested = new URLSearchParams(location.search).get("v");
        const version = versions.includes(requested) ? requested : versions[0];

        for (const v of versions) {
          const option = document.createElement("option");
          option.value = v;
          option.textContent = v === versions[0] ? `${v} (latest)` : v;
          option.selected = v === version;
          select.appendChild(option);
        }

        select.addEventListener("change", () => {
          location.search = `?v=${encodeURIComponent(select.value)}`;
        });

        document.title = `HRIS API Reference ${version}`;
        Redoc.init(
          `/openapi/${version}.json`,
          { hideDownloadButton: false, expandResponses: "200,201" },
          target,
        );
      })();
    </script>
  </body>
</html>
