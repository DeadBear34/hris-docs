# docs.hris.click. Joins the backend's Docker network (hris-backend_default)
# so the Cloudflare Tunnel in the hris-cloudflared container can reach it by
# the service name "docs", like the frontend and the backend.
#
# Zero Trust dashboard → tunnel → Public Hostname:
#   docs.hris.click → HTTP → docs:8080
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  docs:
    build: .
    image: ghcr.io/deadbear34/hris-docs:${IMAGE_TAG:-latest}
    container_name: hris-docs
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:8080"
    logging: *logging

networks:
  default:
    name: hris-backend_default
    external: true
